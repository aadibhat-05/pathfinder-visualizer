<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pathfinding Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1 class="logo">Pathfinder</h1>

    <!-- Algorithm picker -->
    <select id="algo-select">
      <option value="bfs">BFS</option>
      <option value="dfs">DFS</option>
      <option value="dijkstra">Dijkstra</option>
      <option value="astar">A*</option>
      <option value="greedy">Greedy BFS</option>
    </select>

    <!-- Action buttons -->
    <button id="btn-run">▶ Run</button>
    <button id="btn-clear-walls">Clear Walls</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-maze">🌀 Generate Maze</button>
    <button id="btn-compare">⚡ Compare</button>

    <!-- Speed slider -->
    <div class="speed-control">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="1" max="100" value="50" />
    </div>
  </nav>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <span id="stat-algo">Algorithm: —</span>
    <span id="stat-nodes">Nodes explored: —</span>
    <span id="stat-length">Path length: —</span>
    <span id="stat-time">Time: —</span>
  </div>
<!-- LEGEND -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-cell start"></div>
    <span>Start</span>
  </div>
  <div class="legend-item">
    <div class="legend-cell end"></div>
    <span>End</span>
  </div>
  <div class="legend-item">
    <div class="legend-cell wall"></div>
    <span>Wall</span>
  </div>
  <div class="legend-item">
    <div class="legend-cell visited"></div>
    <span>Visited</span>
  </div>
  <div class="legend-item">
    <div class="legend-cell path"></div>
    <span>Path</span>
  </div>
  <div class="legend-item">
    <div class="legend-cell empty"></div>
    <span>Empty</span>
  </div>
</div>
  <!-- GRID -->
  <div id="grid"></div>
  <!-- COMPARISON MODE -->
  <div id="compare-container"></div>

  <script src="script.js"></script>
</body>
</html>
